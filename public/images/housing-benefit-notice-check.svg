<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">주거급여 모의계산과 결정액 대조</title><desc id="desc">예상값과 공식 조사값을 가구, 소득, 임차료, 기간으로 나누어 비교하는 안내</desc><rect width="1200" height="630" fill="#f4f7fc"/><text x="64" y="78" fill="#1559d1" font-family="sans-serif" font-size="24" font-weight="700">복지CHECK · 결정 이후 확인</text><text x="64" y="148" fill="#152033" font-family="sans-serif" font-size="46" font-weight="700">금액이 다르다면, 같은 조건인지 먼저</text><g font-family="sans-serif"><rect x="64" y="195" width="510" height="315" rx="20" fill="#ffffff" stroke="#cad7ec"/><rect x="626" y="195" width="510" height="315" rx="20" fill="#ffffff" stroke="#cad7ec"/><text x="98" y="250" fill="#1559d1" font-size="30" font-weight="700">모의계산 입력값</text><text x="660" y="250" fill="#0b7769" font-size="30" font-weight="700">공식 결정·조사값</text><g fill="#3e5067" font-size="27"><text x="98" y="315">1. 가구원과 주거 형태</text><text x="98" y="363">2. 소득인정액</text><text x="98" y="411">3. 보증금·월차임</text><text x="98" y="459">4. 기준연도·대상 월</text><text x="660" y="315">보장가구·계약관계</text><text x="660" y="363">소득·재산 조사 반영</text><text x="660" y="411">실제임차료·자기부담</text><text x="660" y="459">결정 적용·변경 내역</text></g><text x="64" y="570" fill="#52647c" font-size="25">차이가 남으면 산출 근거를 담당 기관에 문의하세요.</text></g></svg>