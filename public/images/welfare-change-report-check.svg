<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">기초생활보장 변동 신고 준비</title><desc id="desc">변동 내용과 날짜 정리, 관할 기관 연락, 공식 접수와 자료 보완, 처리 결과 확인의 네 단계</desc><rect width="1200" height="630" fill="#f4f7fc"/><g font-family="sans-serif"><text x="64" y="78" fill="#1559d1" font-size="24" font-weight="700">복지CHECK · 수급 중 변화가 생겼을 때</text><text x="64" y="145" fill="#152033" font-size="45" font-weight="700">자동 반영을 기다리기보다, 지체 없이 확인</text><g fill="#ffffff" stroke="#cad7ec"><rect x="64" y="195" width="510" height="145" rx="18"/><rect x="626" y="195" width="510" height="145" rx="18"/><rect x="64" y="372" width="510" height="145" rx="18"/><rect x="626" y="372" width="510" height="145" rx="18"/></g><g fill="#1559d1" font-size="28" font-weight="700"><text x="96" y="244">1. 바뀐 사실 정리</text><text x="658" y="244">2. 관할 기관에 연락</text><text x="96" y="421">3. 접수·보완 확인</text><text x="658" y="421">4. 처리 결과 확인</text></g><g fill="#3e5067" font-size="25"><text x="96" y="294">변동 내용 · 발생일 · 관련 자료</text><text x="658" y="294">신고 항목 · 공식 제출 경로</text><text x="96" y="471">접수 여부 · 추가 자료 · 제출일</text><text x="658" y="471">적용 기간 · 변경 안내 · 문의</text></g><text x="64" y="574" fill="#52647c" font-size="25">신고 기한을 임의로 정하지 마세요. 개인자료는 공식 경로로 제출하세요.</text></g></svg>